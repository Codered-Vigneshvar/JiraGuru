<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project View - JiraGuru</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.3); }
    .muted { color: #94a3b8; }
    ul { padding-left: 18px; }
    button { padding: 8px 12px; border: none; border-radius: 6px; background: #38bdf8; color: #0f172a; font-weight: 700; cursor: pointer; }
    .ghost-btn { background: transparent; color: #e2e8f0; border: 1px solid #334155; }
    .ghost-btn:hover { border-color: #38bdf8; }
    .section-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .ticket-section { margin-top: 12px; }
    .ticket-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .ticket-card { background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: transform 120ms ease, border-color 120ms ease; }
    .ticket-card:hover { transform: translateY(-2px); border-color: #38bdf8; }
    .ticket-card h4 { margin: 0; }
    .ticket-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.3px; }
    .pill.status-todo { background: #1f2937; color: #e5e7eb; }
    .pill.status-in_progress { background: #0ea5e9; color: #0b1725; }
    .pill.status-done { background: #10b981; color: #052e16; }
    .pill.type-epic { background: #f97316; color: #0f172a; }
    .pill.type-story { background: #a3e635; color: #0f172a; }
    .ticket-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .delete-ticket { font-size: 12px; padding: 6px 8px; }
    .ticket-key { font-weight: 700; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <header>
    <div><strong>Project</strong></div>
    <div>
      <button onclick="goBack()">Back</button>
      <a href="/projects/{{ project_id }}/board"><button type="button">Open Board</button></a>
      <a href="/projects/{{ project_id }}/health"><button type="button">View Health Report</button></a>
      <a href="/projects/{{ project_id }}/blockers"><button type="button">Blocker Analysis</button></a>
      <a href="/projects/{{ project_id }}/impacted-tickets"><button type="button">Generate Impact Analysis</button></a>
      <a href="/projects/{{ project_id }}/alignment"><button type="button">Check Project Alignment</button></a>
    </div>
  </header>
  <main>
    <div id="project-container" class="card">
      Loading project...
    </div>
    <div id="project-edit" class="card">
      <h3>Edit Project</h3>
      <p class="muted" id="edit-hint">Only the owner can edit.</p>
      <form id="project-form">
        <label for="project-title">Title</label>
        <input id="project-title" />
        <label for="project-description">Description</label>
        <textarea id="project-description" rows="3"></textarea>
        <label for="project-members">Members (comma separated)</label>
        <input id="project-members" />
        <button type="submit">Save Changes</button>
        <span id="project-save-status" class="muted"></span>
      </form>
    </div>
    <div id="general-chat" class="card">
      <h3>Project Chat</h3>
      <div id="chat-messages-general" style="max-height:200px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:8px; background:#0b162a; border-radius:8px; border:1px solid #1f2937;"></div>
      <div style="margin-top:10px; display:flex; gap:8px; align-items:center;">
        <input id="chat-input-general" placeholder="Ask about the project..." style="flex:1; padding:10px; border-radius:8px; border:1px solid #1f2937; background:#0b162a; color:#e2e8f0;" />
        <button id="chat-send-general">Send</button>
      </div>
      <div id="chat-status-general" class="muted" style="margin-top:6px;"></div>
    </div>
    <div id="epic-stories" class="card"></div>
    <div id="tickets-container" class="card"></div>
    <div id="plan-container" class="card"></div>
    <div id="plan-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; padding:20px;">
      <div style="background:#111827; border:1px solid #334155; border-radius:12px; padding:16px; max-width:800px; width:100%; max-height:80vh; overflow:auto; box-shadow:0 10px 32px rgba(0,0,0,0.35);">
        <h3 style="margin-top:0;">Plan Version</h3>
        <div id="plan-modal-body" style="white-space:pre-wrap; color:#e2e8f0;"></div>
        <div style="margin-top:12px; text-align:right;">
          <button id="plan-modal-close">Close</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const projectId = "{{ project_id }}";
    const currentUser = localStorage.getItem('currentUser');
    let projectTickets = [];
    let currentProjectOwner = null;
    let currentProjectMembers = [];
    let generalChatHistory = [];
    const planModal = document.getElementById('plan-modal');
    const planModalBody = document.getElementById('plan-modal-body');
    const planModalClose = document.getElementById('plan-modal-close');
    if (!currentUser) {
      window.location.href = '/';
    }

    function goBack() {
      if (currentUser === 'Vignesh') {
        window.location.href = '/dashboard/owner';
      } else {
        window.location.href = '/dashboard/user';
      }
    }

    async function loadProject() {
      const res = await fetch(`/api/projects/${projectId}`, {
        headers: { 'X-User': currentUser },
        cache: 'no-store'
      });
      const container = document.getElementById('project-container');
      if (!res.ok) {
        container.innerHTML = '<p class="muted">Unable to load project.</p>';
        return;
      }
      const p = await res.json();
      projectTickets = p.tickets || [];
      currentProjectOwner = p.owner_username;
      currentProjectMembers = p.member_usernames || [];
      container.innerHTML = `
        <h2>${p.title} (${p.code})</h2>
        <p class="muted">${p.description}</p>
        <p><strong>Owner:</strong> ${p.owner_username}</p>
        <p><strong>Members:</strong> ${p.member_usernames.join(', ') || 'None'}</p>
        <div class="card">
          <h3>Documents</h3>
          ${p.documents.length ? `<ul>${p.documents.map(d => `<li>${d.original_name} <span class="muted">(${d.content_type})</span></li>`).join('')}</ul>` : '<p class="muted">No documents yet.</p>'}
        </div>
      `;
      populateProjectForm(p);
      renderTickets();
      renderPlan();
    }

    function renderMarkdown(md) {
      if (!md) return 'No plan saved.';
      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return esc(md).replace(/\\n/g, '<br>');
    }

    function renderTickets() {
      const container = document.getElementById('tickets-container');
      const tickets = projectTickets || [];
      const epics = tickets.filter(t => t.type === 'EPIC');
      const stories = tickets.filter(t => t.type === 'STORY');

      const renderTicketCard = (t) => {
        const statusClass = (t.status || 'TODO').toLowerCase();
        const typeClass = (t.type || 'STORY').toLowerCase();
        return `
          <div class="ticket-card" data-key="${t.key}">
            <div class="ticket-meta">
              <span class="pill type-${typeClass}">${t.type === 'EPIC' ? 'Epic' : 'Story'}</span>
              <span class="pill status-${statusClass}">${t.status}</span>
            </div>
            <div class="ticket-key">${t.key}</div>
            <div class="ticket-title">${t.title}</div>
            <div class="muted">${t.description || ''}</div>
            <div class="ticket-footer">
              <span class="muted">${t.assignee_username ? 'Assignee: ' + t.assignee_username : 'Unassigned'}</span>
              <button class="delete-ticket ghost-btn" data-key="${t.key}">Delete</button>
            </div>
          </div>
        `;
      };

      const renderSection = (label, list) => `
        <div class="ticket-section">
          <div class="section-header">
            <h4>${label}</h4>
            <span class="muted">${list.length} ${label.toLowerCase()}</span>
          </div>
          ${list.length ? `<div class="ticket-grid">${list.map(renderTicketCard).join('')}</div>` : '<p class="muted">None yet.</p>'}
        </div>
      `;

      container.innerHTML = `
        <div class="section-header">
          <div>
            <h3>Epics & User Stories</h3>
            <p class="muted">Click a card to open the detail page for editing, assigning, comments, and documents.</p>
          </div>
          ${tickets.length ? '<button id="clear-tickets" class="ghost-btn">Clear All</button>' : ''}
        </div>
        ${renderSection('Epics', epics)}
        ${renderSection('User Stories', stories)}
      `;

      wireTicketActions();
      renderEpicStories(epics, stories);
    }

    function renderEpicStories(epics, stories) {
      const container = document.getElementById('epic-stories');
      if (!epics.length) {
        container.innerHTML = '<h3>Epics & Stories</h3><p class="muted">No epics yet.</p>';
        return;
      }
      const rows = epics.map(epic => {
        const linked = stories.filter(s => s.epic_key === epic.key);
        const options = linked.length
          ? linked.map(s => `<option value="${s.key}">${s.key} — ${s.title}</option>`).join('')
          : '<option value="">No stories linked</option>';
        return `
          <div class="card" style="margin-bottom:10px; background:#111827; border:1px solid #334155;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
              <div>
                <strong>${epic.key}</strong> — ${epic.title}
                <div class="muted">${epic.description || ''}</div>
              </div>
              <div style="display:flex; gap:8px; align-items:center;">
                <select class="epic-story-select" data-epic="${epic.key}" style="background:#0b162a; color:#e2e8f0; border:1px solid #334155; border-radius:6px; padding:6px;">
                  ${options}
                </select>
                <button class="ghost-btn delete-epic-story" data-epic="${epic.key}">Delete Story</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
      container.innerHTML = `<h3>Epics & Stories Map</h3>${rows}`;
      container.querySelectorAll('.delete-epic-story').forEach(btn => {
        btn.onclick = async () => {
          const epicKey = btn.getAttribute('data-epic');
          const select = container.querySelector(`.epic-story-select[data-epic="${epicKey}"]`);
          const storyKey = select ? select.value : '';
          if (!storyKey) {
            alert('No story selected.');
            return;
          }
          if (!confirm(`Delete story ${storyKey}?`)) return;
          await fetch(`/api/projects/${projectId}/tickets/${storyKey}`, {
            method: 'DELETE',
            headers: { 'X-User': currentUser }
          });
          loadProject();
        };
      });
    }

    function wireTicketActions() {
      const container = document.getElementById('tickets-container');
      container.onclick = async (event) => {
        const deleteBtn = event.target.closest('.delete-ticket');
        if (deleteBtn) {
          event.stopPropagation();
          const key = deleteBtn.getAttribute('data-key');
          if (!confirm(`Delete ticket ${key}?`)) return;
          await fetch(`/api/projects/${projectId}/tickets/${key}`, {
            method: 'DELETE',
            headers: { 'X-User': currentUser }
          });
          loadProject();
          return;
        }
        const card = event.target.closest('.ticket-card');
        if (card) {
          const key = card.getAttribute('data-key');
          window.location.href = `/tickets/${projectId}/${key}`;
        }
      };

      const clearBtn = document.getElementById('clear-tickets');
      if (clearBtn) {
        clearBtn.onclick = async (e) => {
          e.stopPropagation();
          if (!confirm('Delete all tickets?')) return;
          await fetch(`/api/projects/${projectId}/tickets`, {
            method: 'DELETE',
            headers: { 'X-User': currentUser }
          });
          loadProject();
        };
      }
  }
  
  async function renderPlan() {
      let planData = { content: '', updated_at: null };
      let versions = [];
      try {
        const planRes = await fetch(`/api/projects/${projectId}/requirements/plan`, {
          headers: { 'X-User': currentUser },
          cache: 'no-store'
        });
        if (planRes.ok) {
          planData = await planRes.json();
        }
        const versionsRes = await fetch(`/api/projects/${projectId}/requirements/plan/versions`, {
          headers: { 'X-User': currentUser },
          cache: 'no-store'
        }).then(r => r.json()).catch(() => ({ versions: [] }));
        versions = versionsRes.versions || [];
      } catch (err) {
        planData = { content: '', updated_at: null };
        versions = [];
      }
      const latestVersion = versions.length ? versions[versions.length - 1] : null;
      const latestText = (latestVersion && latestVersion.content) || planData.content || '';
      const latestUpdated = (latestVersion && latestVersion.saved_at) || planData.updated_at;
      const historyList = versions.slice().reverse().map((v, idx) => {
        const label = v.saved_at || `Version ${versions.length - idx}`;
        const preview = (v.content || '').slice(0, 120) + ((v.content || '').length > 120 ? '...' : '');
        return `<li><button class="ghost-btn plan-version-btn" data-idx="${versions.length - 1 - idx}">${label}</button> <span class="muted">${preview}</span></li>`;
      }).join('');
      document.getElementById('plan-container').innerHTML = `
        <h3>Requirements Plan</h3>
        <p class="muted">${latestUpdated ? 'Last updated: ' + latestUpdated : 'Not saved yet.'}</p>
        <textarea id="plan-text" rows="10" style="width:100%; background:#0b162a; color:#e2e8f0; border:1px solid #334155; border-radius:8px; padding:10px; white-space:pre-wrap; word-break:break-word; min-height:220px; max-height:420px; overflow:auto; resize:vertical;"></textarea>
        <div style="margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <button id="plan-save-btn">Save Plan</button>
          <span id="plan-save-status" class="muted"></span>
        </div>
        <h4>History</h4>
        ${versions.length ? `<ul id="plan-history" style="list-style:none; padding-left:0;">${historyList}</ul>` : '<p class="muted">No versions yet.</p>'}
      `;
      const planTextArea = document.getElementById('plan-text');
      planTextArea.value = latestText || '';
      document.getElementById('plan-save-btn').onclick = savePlan;
      document.querySelectorAll('.plan-version-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-idx'));
          const version = versions[idx];
          if (version) {
            planModalBody.innerHTML = `<p class="muted">${version.saved_at || ''}</p><div>${renderMarkdown(version.content || '')}</div>`;
            planModal.style.display = 'flex';
          }
        });
      });
    }
    async function savePlan() {
      const content = document.getElementById('plan-text').value;
      const statusEl = document.getElementById('plan-save-status');
      statusEl.textContent = 'Saving...';
      try {
        const res = await fetch(`/api/projects/${projectId}/requirements/plan`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-User': currentUser
          },
          body: JSON.stringify({ content })
        });
        if (res.status === 409) {
          const data = await res.json();
          statusEl.innerHTML = `Conflicts detected. Please resolve:<br>${(data.conflicts || []).map(c => `<div>${c.description || ''}</div>`).join('')}`;
          return;
        }
        if (!res.ok) throw new Error('Save failed');
        await res.json();
        statusEl.textContent = 'Saved.';
        renderPlan();
      } catch (err) {
        statusEl.textContent = 'Save failed.';
      }
    }

    function applyHighlightToPlan() {
      const params = new URLSearchParams(window.location.search);
      const hl = params.get('highlight');
      const pendingPaste = (() => {
        try { return localStorage.getItem('pending_paste_text'); } catch (e) { return null; }
      })();
      if (!hl) return;
      const textarea = document.getElementById('plan-text');
      const idx = textarea.value.indexOf(hl);
      if (idx !== -1) {
        textarea.focus();
        textarea.setSelectionRange(idx, idx + hl.length);
        textarea.scrollTop = textarea.scrollHeight * (idx / textarea.value.length);
        if (pendingPaste) {
          const before = textarea.value.slice(0, idx);
          const after = textarea.value.slice(idx + hl.length);
          textarea.value = `${before}${pendingPaste}${after}`;
          try { localStorage.removeItem('pending_paste_text'); } catch (e) {}
        }
      }
    }

    loadProject();

    function populateProjectForm(p) {
      document.getElementById('project-title').value = p.title || '';
      document.getElementById('project-description').value = p.description || '';
      document.getElementById('project-members').value = (p.member_usernames || []).join(', ');
      const isOwner = currentUser === p.owner_username;
      document.getElementById('project-form').querySelectorAll('input, textarea, button').forEach(el => el.disabled = !isOwner);
      document.getElementById('edit-hint').textContent = isOwner ? 'You are the owner. Edit details below.' : 'Only the owner can edit.';
    }

    document.getElementById('project-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('project-save-status');
      statusEl.textContent = 'Saving...';
      const members = document.getElementById('project-members').value.split(',').map(x => x.trim()).filter(Boolean);
      const payload = {
        title: document.getElementById('project-title').value,
        description: document.getElementById('project-description').value,
        member_usernames: members,
      };
      try {
        await fetch(`/api/projects/${projectId}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'X-User': currentUser
          },
          body: JSON.stringify(payload)
        }).then(r => {
          if (!r.ok) throw new Error('Save failed');
          return r.json();
        });
        statusEl.textContent = 'Saved.';
        loadProject();
      } catch (err) {
        statusEl.textContent = 'Failed to save (owner only).';
      }
    });

    // ---------------- General chat (project-level)
    const chatMessagesGeneral = document.getElementById('chat-messages-general');
    const chatInputGeneral = document.getElementById('chat-input-general');
    const chatSendGeneral = document.getElementById('chat-send-general');
    const chatStatusGeneral = document.getElementById('chat-status-general');

    function appendGeneral(role, content) {
      const div = document.createElement('div');
      div.innerHTML = `<strong>${role === 'user' ? 'You' : 'AI'}:</strong> ${content}`;
      chatMessagesGeneral.appendChild(div);
      chatMessagesGeneral.scrollTop = chatMessagesGeneral.scrollHeight;
    }

    async function sendGeneralChat() {
      const msg = chatInputGeneral.value.trim();
      if (!msg) return;
      generalChatHistory.push({ role: 'user', content: msg });
      appendGeneral('user', msg);
      chatInputGeneral.value = '';
      chatStatusGeneral.textContent = 'Thinking...';
      try {
        const data = await fetch(`/api/projects/${projectId}/general_chat`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-User': currentUser || ''
          },
          body: JSON.stringify({ messages: generalChatHistory })
        }).then(r => r.json());
        const reply = data.reply || 'No answer.';
        generalChatHistory.push({ role: 'assistant', content: reply });
        appendGeneral('assistant', reply);
        chatStatusGeneral.textContent = '';
      } catch (err) {
        chatStatusGeneral.textContent = 'Chat failed.';
      }
    }

  chatSendGeneral.addEventListener('click', sendGeneralChat);
  chatInputGeneral.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendGeneralChat(); }});
  planModalClose.addEventListener('click', () => { planModal.style.display = 'none'; });
  planModal.addEventListener('click', (e) => { if (e.target === planModal) planModal.style.display = 'none'; });
  applyHighlightToPlan();

    function refreshProjectView() {
      loadProject();
      loadUsers();
    }
    refreshProjectView();
    window.addEventListener('focus', refreshProjectView);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        refreshProjectView();
      }
    });
    window.addEventListener('pageshow', (e) => {
      if (e.persisted || document.visibilityState === 'visible') {
        refreshProjectView();
      }
    });
</script>
</body>
</html>

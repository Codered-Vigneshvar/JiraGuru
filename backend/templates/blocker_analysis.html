<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocker Analysis</title>
  <style>
    body { margin:0; font-family: "Inter", system-ui, -apple-system, sans-serif; background:#0f172a; color:#e2e8f0; }
    header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; background:#1e293b; }
    main { max-width:1100px; margin:0 auto; padding:24px; display:flex; flex-direction:column; gap:16px; }
    .card { background:#111827; border:1px solid #1f2937; border-radius:12px; padding:16px; box-shadow:0 12px 32px rgba(0,0,0,0.35); }
    .root { border:1px solid #38bdf8; }
    .muted { color:#94a3b8; }
    .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-weight:700; letter-spacing:0.3px; font-size:12px; }
    .status-TODO { background:#1f2937; color:#e2e8f0; }
    .status-IN_PROGRESS { background:#0ea5e9; color:#0b1725; }
    .status-DONE { background:#10b981; color:#052e16; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid #1f2937; }
    th { color:#cbd5e1; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; }
    button, a.button { padding:8px 12px; border:none; border-radius:8px; background:#38bdf8; color:#0f172a; font-weight:700; text-decoration:none; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 style="margin:0;">Blocker Analysis</h1>
      <div id="project-label" class="muted">Loading...</div>
    </div>
    <div>
      <a class="button" id="back-link">Back to Project</a>
    </div>
  </header>

  <main>
    <div id="chains-container" class="card">Loading analysis...</div>
  </main>

  <script>
    const projectId = "{{ project_id }}";
    const currentUser = localStorage.getItem('currentUser');
    if (!currentUser) window.location.href = '/';
    document.getElementById('back-link').href = `/projects/${projectId}/view`;

    function statusBadge(status) {
      return `<span class="badge status-${status}">${status}</span>`;
    }

    function renderChains(data) {
      document.getElementById('project-label').textContent = data.project_code || projectId;
      const container = document.getElementById('chains-container');
      const depsView = data.dependency_view || [];
      if (depsView.length) {
        container.innerHTML = depsView.map(entry => {
          const deps = entry.dependencies.map(d => `<li>${d.ticket_key}${d.title ? ' — ' + d.title : ''}${d.status ? ' (' + d.status + ')' : ''}</li>`).join('');
          return `
            <div class="card root" style="border-color:#334155;">
              <div style="display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap;">
                <div>
                  <div><strong>${entry.ticket_key}</strong> — ${entry.title}</div>
                  <div class="muted" style="margin-top:4px;">These dependencies must finish before this ticket can proceed.</div>
                </div>
                ${statusBadge(entry.status || 'TODO')}
              </div>
              <div style="margin-top:10px;">
                <div class="muted" style="margin-bottom:4px;">Dependency tickets</div>
                <ul style="margin:0; padding-left:18px;">${deps}</ul>
              </div>
            </div>
          `;
        }).join('');
        return;
      }

      if (!data.chains || !data.chains.length) {
        container.innerHTML = '<p>No blockers detected 🎉</p>';
        return;
      }

      const entriesMap = new Map();
      data.chains.forEach(chain => {
        if (chain.root_dependencies && chain.root_dependencies.length) {
          entriesMap.set(chain.root_ticket_key, {
            ticket_key: chain.root_ticket_key,
            title: chain.root_title,
            status: chain.root_status,
            dependencies: chain.root_dependencies
          });
        }
        (chain.affected_tickets || []).forEach(t => {
          if (t.dependencies && t.dependencies.length) {
            entriesMap.set(t.ticket_key, {
              ticket_key: t.ticket_key,
              title: t.title,
              status: t.status,
              dependencies: t.dependencies
            });
          }
        });
      });

      const entries = Array.from(entriesMap.values());
      if (!entries.length) {
        container.innerHTML = '<p class="muted">No tickets with recorded dependencies.</p>';
        return;
      }

      container.innerHTML = entries.map(entry => {
        const deps = entry.dependencies.map(d => {
          return `<li>${d.ticket_key}${d.title ? ' — ' + d.title : ''}${d.status ? ' (' + d.status + ')' : ''}</li>`;
        }).join('');
        return `
          <div class="card root" style="border-color:#334155;">
            <div style="display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap;">
              <div>
                <div><strong>${entry.ticket_key}</strong> — ${entry.title}</div>
                <div class="muted" style="margin-top:4px;">These dependencies must finish before this ticket can proceed.</div>
              </div>
              ${statusBadge(entry.status || 'TODO')}
            </div>
            <div style="margin-top:10px;">
              <div class="muted" style="margin-bottom:4px;">Dependency tickets</div>
              <ul style="margin:0; padding-left:18px;">${deps}</ul>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadAnalysis() {
      try {
        const res = await fetch(`/api/projects/${projectId}/blocker_analysis`, {
          headers: { 'X-User': currentUser }
        });
        if (!res.ok) throw new Error('Failed');
        const data = await res.json();
        renderChains(data);
      } catch (err) {
        document.getElementById('chains-container').innerHTML = '<p class="muted">Unable to load blocker analysis.</p>';
      }
    }

    loadAnalysis();
  </script>
</body>
</html>
